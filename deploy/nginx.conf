# nginx перед сервером РОЛЛЕВИЧ: HTTPS, сжатие, живые обновления CRM.
# Установка: sudo cp deploy/nginx.conf /etc/nginx/sites-available/rollevich
#            sudo ln -s /etc/nginx/sites-available/rollevich /etc/nginx/sites-enabled/
#            замените rollevich.ru на свой домен, затем: sudo certbot --nginx -d rollevich.ru -d www.rollevich.ru
server {
    listen 80;
    server_name rollevich.ru www.rollevich.ru;

    client_max_body_size 64k;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Живые обновления CRM (Server-Sent Events): без буферизации и с длинным таймаутом
    location = /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
